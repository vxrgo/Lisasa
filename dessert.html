<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pilih Dessert</title>
    <link rel="stylesheet" href="css/dessert.css" />
  </head>
  <body>
    <div id="dessertquestion">Pencuci mulutnya mau nyemil apa?</div>

    <div class="dessert-selection">
      <div class="dessert-item">
        <img src="food/boba.jpeg" alt="boba" />
        <label
          ><input type="checkbox" name="dessert" value="Boba" /> Boba / kopi</label
        >
      </div>
      <div class="dessert-item">
        <img src="food/churro.jpeg" alt="churro" />
        <label
          ><input type="checkbox" name="dessert" value="Churros" /> Churros</label
        >
      </div>
      <div class="dessert-item">
        <img src="food/che.jpeg" alt="es campur" />
        <label><input type="checkbox" name="dessert" value="Es Campur" /> Es campur / dessert manis</label>
      </div>
      <div class="dessert-item">
        <img src="food/mochi.jpeg" alt="mochi" />
        <label
          ><input type="checkbox" name="dessert" value="Mochi" /> Mochi</label
        >
      </div>
      <div class="dessert-item">
        <img src="food/randombun.jpeg" alt="roti manis" />
        <label
          ><input type="checkbox" name="dessert" value="Roti Manis" /> Roti / bakpao manis</label
        >
      </div>
      <div class="dessert-item">
        <img src="food/taiyaki.jpeg" alt="es krim taiyaki" />
        <label
          ><input type="checkbox" name="dessert" value="Taiyaki" />
          Es krim taiyaki</label
        >
      </div>
    </div>
    <button class="button" onclick="location.href='activities.html'">
      Lanjut aktivitas seru! 🎡
    </button>
  </body>
</html>
