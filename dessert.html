<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pilih Dessert</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/dessert.css" />
  </head>
  <body>
    <div class="step-badge">Langkah 3 dari 4: Pilihan Dessert</div>
    <div id="dessertquestion">Pencuci mulutnya mau nyemil apa?</div>
    <div class="subtitle-hint">🍨 Boleh pilih lebih dari satu yaa! 🍨</div>

    <div class="dessert-selection">
      <div class="dessert-item">
        <img src="food/boba.jpeg" alt="boba" />
        <label
          ><input type="checkbox" name="dessert" value="Boba" /> Boba / kopi</label
        >
      </div>
      <div class="dessert-item">
        <img src="food/churro.jpeg" alt="churro" />
        <label
          ><input type="checkbox" name="dessert" value="Churros" /> Churros</label
        >
      </div>
      <div class="dessert-item">
        <img src="food/che.jpeg" alt="es campur" />
        <label><input type="checkbox" name="dessert" value="Es Campur" /> Es campur / dessert manis</label>
      </div>
      <div class="dessert-item">
        <img src="food/mochi.jpeg" alt="mochi" />
        <label
          ><input type="checkbox" name="dessert" value="Mochi" /> Mochi</label
        >
      </div>
      <div class="dessert-item">
        <img src="food/randombun.jpeg" alt="roti manis" />
        <label
          ><input type="checkbox" name="dessert" value="Roti Manis" /> Roti / bakpao manis</label
        >
      </div>
      <div class="dessert-item">
        <img src="food/taiyaki.jpeg" alt="es krim taiyaki" />
        <label
          ><input type="checkbox" name="dessert" value="Taiyaki" />
          Es krim taiyaki</label
        >
      </div>
    </div>

    <div class="nav-buttons">
      <button type="button" class="back-button" onclick="location.href='food.html'">
        ← Ganti Makanan
      </button>
      <button class="button" onclick="nextStep()">
        Lanjut aktivitas seru! 🎡
      </button>
    </div>

    <script>
      // Centang ulang pilihan sebelumnya jika ada di localStorage
      window.addEventListener("DOMContentLoaded", function () {
        var savedDessert = JSON.parse(localStorage.getItem("kencan_dessert") || "[]");
        if (Array.isArray(savedDessert)) {
          document.querySelectorAll('input[name="dessert"]').forEach(function (cb) {
            if (savedDessert.indexOf(cb.value) !== -1) {
              cb.checked = true;
            }
          });
        }
      });

      function nextStep() {
        var checked = Array.from(
          document.querySelectorAll('input[name="dessert"]:checked')
        ).map(function (el) {
          return el.value;
        });
        localStorage.setItem(
          "kencan_dessert",
          JSON.stringify(checked.length ? checked : ["Bebas apa aja"])
        );
        window.location.href = "activities.html";
      }

      document.querySelectorAll(".dessert-item").forEach(function (item) {
        item.addEventListener("click", function (e) {
          if (e.target.tagName !== "INPUT") {
            var cb = item.querySelector('input[type="checkbox"]');
            cb.checked = !cb.checked;
          }
        });
      });
    </script>
  </body>
</html>
