<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mau Ngapain Aja?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/activities.css" />
  </head>
  <body>
    <div id="activityquestion"><b>Abis makan kita mau ngapain aja nih?</b></div>
    <div class="activities-selection">
      <div class="activity-item">
        <img src="activities/aquarium.jpeg" alt="aquarium" />
        <label
          ><input
            type="checkbox"
            name="activities"
            value="Aquarium"
          />Lihat ikan di aquarium</label
        >
      </div>
      <div class="activity-item">
        <img src="activities/arcade.jpeg" alt="arcade" />
        <label
          ><input
            type="checkbox"
            name="activities"
            value="Arcade"
          />Main timezone / arcade</label
        >
      </div>
      <div class="activity-item">
        <img src="activities/cinema.jpeg" alt="cinema" />
        <label
          ><input
            type="checkbox"
            name="activities"
            value="Bioskop"
          />Nonton bioskop</label
        >
      </div>
      <div class="activity-item">
        <img src="activities/keramika.jpeg" alt="pottery" />
        <label
          ><input
            type="checkbox"
            name="activities"
            value="Pottery"
          />Bikin keramik / pottery</label
        >
      </div>
      <div class="activity-item">
        <img src="activities/kunsthalle.jpeg" alt="galeri seni" />
        <label
          ><input
            type="checkbox"
            name="activities"
            value="Galeri Seni"
          />Pameran seni / gallery</label
        >
      </div>
      <div class="activity-item">
        <img src="activities/park.jpeg" alt="taman" />
        <label
          ><input
            type="checkbox"
            name="activities"
            value="Taman"
          />Santai di taman</label
        >
      </div>
    </div>
    <button class="button" id="submitBtn" onclick="submitAndNext()">
      Buka pesan terakhir ✨
    </button>

    <script>
      var WEBHOOK_URL =
        "https://script.google.com/macros/s/AKfycbwNSrCAQBQLMvWmr0bh7TC6dBA073PkIP7jtaD6F1zaJ5fZNC4L4oqOdpgLZFxixiA/exec";

      async function submitAndNext() {
        var btn = document.getElementById("submitBtn");
        btn.innerText = "Mengirim...";
        btn.disabled = true;

        var checked = Array.from(
          document.querySelectorAll('input[name="activities"]:checked')
        ).map(function (el) {
          return el.value;
        });
        var activities = checked.length ? checked : ["Bebas apa aja"];
        localStorage.setItem("kencan_activities", JSON.stringify(activities));

        var date = localStorage.getItem("kencan_date") || "Belum dipilih";
        var food = JSON.parse(
          localStorage.getItem("kencan_food") || '["Bebas apa aja"]'
        );
        var dessert = JSON.parse(
          localStorage.getItem("kencan_dessert") || '["Bebas apa aja"]'
        );

        var payload = {
          date: date,
          food: food,
          dessert: dessert,
          activities: activities
        };

        try {
          await fetch(WEBHOOK_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
          });
        } catch (err) {
          console.error("Gagal kirim webhook:", err);
        }

        window.location.href = "lastpage.html";
      }

      document.querySelectorAll(".activity-item").forEach(function (item) {
        item.addEventListener("click", function (e) {
          if (e.target.tagName !== "INPUT") {
            var cb = item.querySelector('input[type="checkbox"]');
            cb.checked = !cb.checked;
          }
        });
      });
    </script>
  </body>
</html>
