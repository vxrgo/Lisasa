<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mau Ngapain Aja?</title>
    <link rel="stylesheet" href="css/activities.css" />
  </head>
  <body>
    <div id="activityquestion"><b>Abis makan kita mau ngapain aja nih?</b></div>
    <div class="activities-selection">
      <div class="activity-item">
        <img src="activities/aquarium.jpeg" alt="aquarium" />
        <label
          ><input
            type="checkbox"
            name="activities"
            value="Aquarium"
          />Lihat ikan di aquarium</label
        >
      </div>
      <div class="activity-item">
        <img src="activities/arcade.jpeg" alt="arcade" />
        <label
          ><input
            type="checkbox"
            name="activities"
            value="Arcade"
          />Main timezone / arcade</label
        >
      </div>
      <div class="activity-item">
        <img src="activities/cinema.jpeg" alt="cinema" />
        <label
          ><input
            type="checkbox"
            name="activities"
            value="Bioskop"
          />Nonton bioskop</label
        >
      </div>
      <div class="activity-item">
        <img src="activities/keramika.jpeg" alt="pottery" />
        <label
          ><input
            type="checkbox"
            name="activities"
            value="Pottery"
          />Bikin keramik / pottery</label
        >
      </div>
      <div class="activity-item">
        <img src="activities/kunsthalle.jpeg" alt="galeri seni" />
        <label
          ><input
            type="checkbox"
            name="activities"
            value="Galeri Seni"
          />Pameran seni / gallery</label
        >
      </div>
      <div class="activity-item">
        <img src="activities/park.jpeg" alt="taman" />
        <label
          ><input
            type="checkbox"
            name="activities"
            value="Taman"
          />Santai di taman</label
        >
      </div>
    </div>
    <button class="button" onclick="location.href='lastpage.html'">
      Buka pesan terakhir ✨
    </button>
  </body>
</html>
