<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Makasii Banyak! ❤️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/flower.css" />
  </head>
  <body>
    <div id="thankyou"><b>Makasih yaa udah mau jadi pacar aku! 🥰💐</b></div>

    <!-- Tiket Kencan Kolaboratif -->
    <div class="ticket-card">
      <div class="ticket-header">🎟️ OFFICIAL FIRST DATE PASS 🎟️</div>
      <div class="ticket-row">
        <span class="ticket-label">📅 Tanggal Kencan:</span>
        <span class="ticket-value" id="valDate">Memuat...</span>
      </div>
      <div class="ticket-row">
        <span class="ticket-label">🍔 Menu Makanan:</span>
        <span class="ticket-value" id="valFood">Memuat...</span>
      </div>
      <div class="ticket-row">
        <span class="ticket-label">🍰 Pilihan Dessert:</span>
        <span class="ticket-value" id="valDessert">Memuat...</span>
      </div>
      <div class="ticket-row">
        <span class="ticket-label">🎡 Aktivitas Seru:</span>
        <span class="ticket-value" id="valActivities">Memuat...</span>
      </div>
      <div class="ticket-footer">
        <button class="wa-button" onclick="shareToWhatsApp()">
          Bagikan Rencana Kencan ke WhatsApp 💬
        </button>
        <button class="edit-ticket-btn" onclick="location.href='date.html'">
          ✏️ Ubah Rencana Kencan
        </button>
      </div>
    </div>

    <!-- Animasi Bunga Mekar -->
    <div class="flower">
      <div class="f-wrapper">
        <div class="flower__line"></div>
        <div class="f">
          <div class="flower__leaf flower__leaf--1"></div>
          <div class="flower__leaf flower__leaf--2"></div>
          <div class="flower__leaf flower__leaf--3"></div>
          <div class="flower__leaf flower__leaf--4"></div>
          <div class="flower__leaf flower__leaf--5"></div>
          <div class="flower__leaf flower__leaf--6"></div>
          <div class="flower__leaf flower__leaf--7"></div>
          <div
            class="flower__leaf flower__leaf--8 flower__fall-down--yellow"
          ></div>
        </div>
      </div>

      <div class="f-wrapper f-wrapper--2">
        <div class="flower__line"></div>
        <div class="f">
          <div class="flower__leaf flower__leaf--1"></div>
          <div class="flower__leaf flower__leaf--2"></div>
          <div class="flower__leaf flower__leaf--3"></div>
          <div class="flower__leaf flower__leaf--4"></div>
          <div class="flower__leaf flower__leaf--5"></div>
          <div class="flower__leaf flower__leaf--6"></div>
          <div class="flower__leaf flower__leaf--7"></div>
          <div
            class="flower__leaf flower__leaf--8 flower__fall-down--pink"
          ></div>
        </div>
      </div>

      <div class="f-wrapper f-wrapper--3">
        <div class="flower__line"></div>
        <div class="f">
          <div class="flower__leaf flower__leaf--1"></div>
          <div class="flower__leaf flower__leaf--2"></div>
          <div class="flower__leaf flower__leaf--3"></div>
          <div class="flower__leaf flower__leaf--4"></div>
          <div class="flower__leaf flower__leaf--5"></div>
          <div class="flower__leaf flower__leaf--6"></div>
          <div class="flower__leaf flower__leaf--7"></div>
          <div
            class="flower__leaf flower__leaf--8 flower__fall-down--purple"
          ></div>
        </div>
      </div>
      <div class="flower__glass"></div>
    </div>

    <script>
      function formatDate(str) {
        if (!str || str === "Belum dipilih") return "Kapan-kapan kita tentuin yaa";
        try {
          var parts = str.split("-");
          if (parts.length === 3) {
            var d = new Date(parts[0], parts[1] - 1, parts[2]);
            var options = {
              weekday: "long",
              year: "numeric",
              month: "long",
              day: "numeric"
            };
            return d.toLocaleDateString("id-ID", options);
          }
          return str;
        } catch (e) {
          return str;
        }
      }

      var rawDate = localStorage.getItem("kencan_date") || "Belum dipilih";
      var rawFood = JSON.parse(
        localStorage.getItem("kencan_food") || '["Bebas apa aja"]'
      );
      var rawDessert = JSON.parse(
        localStorage.getItem("kencan_dessert") || '["Bebas apa aja"]'
      );
      var rawActivities = JSON.parse(
        localStorage.getItem("kencan_activities") || '["Bebas apa aja"]'
      );

      var displayDate = formatDate(rawDate);
      var displayFood = Array.isArray(rawFood) ? rawFood.join(", ") : rawFood;
      var displayDessert = Array.isArray(rawDessert)
        ? rawDessert.join(", ")
        : rawDessert;
      var displayActivities = Array.isArray(rawActivities)
        ? rawActivities.join(", ")
        : rawActivities;

      document.getElementById("valDate").innerText = displayDate;
      document.getElementById("valFood").innerText = displayFood;
      document.getElementById("valDessert").innerText = displayDessert;
      document.getElementById("valActivities").innerText = displayActivities;

      function shareToWhatsApp() {
        var text =
          "Hai sayang! Ini rangkuman kencan kita yaa 🥰💖\n\n" +
          "📅 Tanggal: " +
          displayDate +
          "\n" +
          "🍔 Makanan: " +
          displayFood +
          "\n" +
          "🍰 Dessert: " +
          displayDessert +
          "\n" +
          "🎡 Aktivitas: " +
          displayActivities +
          "\n\n" +
          "Sampai ketemu nanti yaa sayang! ❤️✨";

        var url = "https://wa.me/?text=" + encodeURIComponent(text);
        window.open(url, "_blank");
      }
    </script>
  </body>
</html>
