<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pilih Makanan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/food.css" />
  </head>
  <body>
    <div id="foodquestion">
      <b>Nanti mau mam apa nih?</b>
    </div>

    <div class="food-selection">
      <div class="food-item">
        <img src="food/burgers.jpeg" alt="Burger dan ayam goreng" />
        <label
          ><input
            type="checkbox"
            name="food"
            value="Burger & Ayam Goreng"
          />
          Burger & ayam goreng</label
        >
      </div>
      <div class="food-item">
        <img src="food/dog.jpeg" alt="hotdog" />
        <label
          ><input type="checkbox" name="food" value="Hotdog" /> Hotdog</label
        >
      </div>
      <div class="food-item">
        <img src="food/koreanfood.jpeg" alt="Makanan korea" />
        <label
          ><input type="checkbox" name="food" value="Makanan Korea" /> Makanan
          Korea</label
        >
      </div>
      <div class="food-item">
        <img src="food/pasta.jpeg" alt="pasta" />
        <label><input type="checkbox" name="food" value="Pasta" /> Pasta / spaghetti</label>
      </div>
      <div class="food-item">
        <img src="food/pizza.jpeg" alt="pizza" />
        <label><input type="checkbox" name="food" value="Pizza" /> Pizza</label>
      </div>
      <div class="food-item">
        <img src="food/salad.jpeg" alt="salad" />
        <label><input type="checkbox" name="food" value="Salad" /> Salad (sehat dikit)</label>
      </div>
      <div class="food-item">
        <img src="food/steak.jpeg" alt="steak" />
        <label><input type="checkbox" name="food" value="Steak" /> Steak</label>
      </div>
      <div class="food-item">
        <img src="food/sushi.jpeg" alt="sushi" />
        <label><input type="checkbox" name="food" value="Sushi" /> Sushi</label>
      </div>
    </div>
    <button class="button" onclick="nextStep()">
      Lanjut pilih dessert! 🍰
    </button>

    <script>
      function nextStep() {
        var checked = Array.from(
          document.querySelectorAll('input[name="food"]:checked')
        ).map(function (el) {
          return el.value;
        });
        localStorage.setItem(
          "kencan_food",
          JSON.stringify(checked.length ? checked : ["Bebas apa aja"])
        );
        window.location.href = "dessert.html";
      }

      document.querySelectorAll(".food-item").forEach(function (item) {
        item.addEventListener("click", function (e) {
          if (e.target.tagName !== "INPUT") {
            var cb = item.querySelector('input[type="checkbox"]');
            cb.checked = !cb.checked;
          }
        });
      });
    </script>
  </body>
</html>
