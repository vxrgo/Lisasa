<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mau Jadi Pacar Guweh?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/valentine.css" />
  </head>
  <body>
    <div id="valentineQuestion"><b>lo mau jadi pacar guweh?</b></div>
    <div class="button-container">
      <button class="answerButton" id="yesButton" onclick="location.href='thankyou.html'">
        mau
      </button>
      <button class="answerButton" id="noButton">ga dulu</button>
    </div>
    <img src="cat.gif" alt="kucing nanya pertanyaan" class="responsive" />

    <script>
      var dialogues = [
        "ga dulu",
        "yakin gamau? 🥺",
        "beneran nih? 😢",
        "pikir-pikir dulu dong...",
        "jahat bgt sih 💔",
        "coba pencet yang mau!",
        "gabisa nolak wlee 😜",
        "harus mau pokoknya! 😤"
      ];
      var clickCount = 0;
      var noBtn = document.getElementById("noButton");
      var yesBtn = document.getElementById("yesButton");

      function handleNo() {
        clickCount++;
        var currentFontSize = parseInt(window.getComputedStyle(yesBtn).fontSize) || 18;
        yesBtn.style.fontSize = Math.min(currentFontSize + 8, 54) + "px";
        yesBtn.style.padding = "16px 32px";

        var textIndex = Math.min(clickCount, dialogues.length - 1);
        noBtn.innerText = dialogues[textIndex];

        // Efek menghindar lucu
        var x = (Math.random() - 0.5) * 60;
        var y = (Math.random() - 0.5) * 30;
        noBtn.style.transform = "translate(" + x + "px, " + y + "px)";
      }

      noBtn.addEventListener("click", handleNo);
    </script>
  </body>
</html>
