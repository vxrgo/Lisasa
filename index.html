<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mau Jadi Pacar Guweh?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/valentine.css" />
  </head>
  <body>
    <div id="valentineQuestion"><b>lo mau jadi pacar guweh?</b></div>
    <div class="button-container">
      <button class="answerButton" onclick="location.href='thankyou.html'">
        mau
      </button>
      <button class="answerButton" id="noButton">ga dulu</button>
    </div>
    <img src="cat.gif" alt="kucing nanya pertanyaan" class="responsive" />

    <script>
      document
        .getElementById("noButton")
        .addEventListener("click", function () {
          var yesButton = document.querySelector(
            'button[onclick*="thankyou.html"]'
          );
          var currentFontSize = parseInt(
            window.getComputedStyle(yesButton).fontSize
          );
          // Naikkan ukuran font tombol mau bertahap
          yesButton.style.fontSize = Math.min(currentFontSize + 12, 60) + "px";
          yesButton.style.padding = "16px 32px";
        });
    </script>
  </body>
</html>
